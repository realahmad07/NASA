[project]
name = "pyrosage"
version = "0.1.0"
description = "Technique-bounded microgravity combustion evidence analysis dashboard"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
