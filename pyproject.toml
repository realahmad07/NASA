[project]
name = "pyrosage"
version = "0.1.0"
description = "Technique-bounded microgravity combustion evidence analysis dashboard"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.3",
    "opencv-python-headless>=4.10.0",
    "pymupdf>=1.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
